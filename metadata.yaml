name: astrbot_plugin_maid_agent
version: "2.0.5"
description: "大小姐+管家模式子代理系统：由五个 Claude 风格 maid 工具调度隔离或真实聊天会话的 subagent。"
author: "Kalo"
repo: "https://github.com/Kalospacer/astrbot_plugin_maid_agent"
display_name: "代理女仆"
astrbot_version: ">=4.20.0"
# ============================================================
# 依赖说明
# ============================================================
# 本插件需要配合 AstrBot 的 subagent 功能使用：
#
# 1. 必须在 AstrBot 配置中启用至少一个可用的 subagent
# 2. 插件实际调度目标由插件配置中的 `allowed_agent_names` 以及主模型对
#    `maid_agent` 的调用参数一起决定；每次任务必须显式指定 agent
# 3. subagent 配置示例：
#    subagent_orchestrator:
#      agents:
#        - name: muiceagent
#          enabled: true
#          system_prompt: |
#            你是管家，负责处理大小姐转交的执行任务...
#          tools: null
#
# 详细配置说明请参考 README.md
# ============================================================

# 插件启用后的行为说明：
# 1. 主模型（大小姐）只看到自然语言对话历史，不直接持有工具
# 2. 主模型通过原生 `maid_agent` Function Call 表达调度意图
# 3. 聊天任务由 `dispatch_session_mode` 固定为 foreground 或 background，运行中不会切换
# 4. 插件在后台调度 subagent，并将执行结果回灌给大小姐
# 5. 可用 `maid_send_message`、`maid_task_output`、`maid_task_stop` 查询或控制任务
