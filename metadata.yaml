name: astrbot_plugin_maid_agent
version: "2.0.69"
description: "大小姐+管家双代理角色扮演：大小姐只负责聊天，工具调用全部交给管家 subagent 执行，主模型上下文保持纯净不被工具提示词污染。"
author: "Kalo"
repo: "https://github.com/Kalospacer/astrbot_plugin_maid_agent"
display_name: "代理女仆"
astrbot_version: ">=4.27.3"
# ============================================================
# 依赖说明
# ============================================================
# 本插件需要配合 AstrBot 的 subagent 功能使用：
#
# 1. 无需手动配置 subagent：一个都没有时，插件会自动创建一个默认管家
#    subagent（名称取插件配置的 `default_agent_name`，默认 `butler`，
#    不限制工具、跟随当前聊天 provider）
# 2. 模型派发统一使用 `default_agent_name`，不填写子代理名称或 session ID；
#    `allowed_agent_names` 限制默认配置与控制台的可选管家
# 3. subagent 配置示例：
#    subagent_orchestrator:
#      agents:
#        - name: muiceagent
#          enabled: true
#          system_prompt: |
#            你是管家，负责处理大小姐转交的执行任务...
#          tools: null
#
# 详细配置说明请参考 README.md
# ============================================================

# 插件启用后的行为说明：
# 1. 主模型（大小姐）只看到自然语言对话历史，不直接持有工具
# 2. 主模型通过原生 `maid_agent` Function Call 表达调度意图
# 3. 派发立即返回句柄，不阻塞主模型，用户可以在女仆干活时继续聊天
# 4. 最终汇报由大小姐转述；打开 show_maid_speech / show_maid_tool_status 后，
#    女仆干活途中的正文与函数调用状态也会以 `agent名: ...` 即时发到聊天（默认关）
# 5. 运行中补充使用 `maid_send_message`；完成后继续使用 `maid_agent`
# 6. task 管任务、session 管上下文，空闲过期不作废任务编号
# 7. 插件独立 `max_agent_steps` 默认 128，空闲窗口默认五小时且可配置
