<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>代理女仆控制台</title>
    <link rel="stylesheet" href="./style.css" />
    <script src="/api/plugin/page/bridge-sdk.js"></script>
    <script src="./app.js" defer></script>
  </head>
  <body>
    <main class="shell">
      <aside class="pane pane-left" aria-label="任务与历史">
        <header class="pane-header">
          <div>
            <p class="eyebrow">Maid Agent</p>
            <h1>调度舱</h1>
          </div>
          <span id="streamState" class="signal signal-idle">离线</span>
        </header>

        <section class="overview-grid" aria-label="任务概览">
          <div>
            <span id="countRunning">0</span>
            <small>运行</small>
          </div>
          <div>
            <span id="countDone">0</span>
            <small>完成</small>
          </div>
          <div>
            <span id="countError">0</span>
            <small>异常</small>
          </div>
        </section>

        <form id="filterForm" class="filter-row">
          <input id="searchInput" type="search" placeholder="搜索任务、agent、原文" />
          <select id="statusFilter" aria-label="状态筛选">
            <option value="">全部</option>
            <option value="queued">排队</option>
            <option value="running">运行</option>
            <option value="stopping">停止中</option>
            <option value="done">完成</option>
            <option value="partial_done">部分完成</option>
            <option value="error">异常</option>
            <option value="stopped">停止</option>
          </select>
        </form>

        <div id="taskList" class="task-list" aria-live="polite"></div>

        <section class="dispatch-panel" aria-label="手动派发">
          <h2>手动派发</h2>
          <form id="dispatchForm">
            <label>
              <span>目标 UMO</span>
              <input id="dispatchUmo" autocomplete="off" placeholder="platform:FriendMessage:id" />
            </label>
            <label>
              <span>Agent</span>
              <select id="dispatchAgent"></select>
            </label>
            <label>
              <span>任务要求</span>
              <textarea id="dispatchText" rows="4" placeholder="交给管家的具体任务"></textarea>
            </label>
            <label>
              <span>大小姐回复</span>
              <textarea id="dispatchReply" rows="2" placeholder="可选"></textarea>
            </label>
            <button class="primary" type="submit">派发</button>
          </form>
        </section>
      </aside>

      <section class="pane pane-center" aria-label="事件轨道">
        <header class="center-header">
          <div>
            <p class="eyebrow">Event rail</p>
            <h2 id="selectedTitle">选择一个任务</h2>
          </div>
          <button id="refreshButton" class="ghost" type="button">刷新</button>
        </header>

        <div id="stageRail" class="stage-rail"></div>
        <div id="eventList" class="event-list empty-state">
          <p>暂无事件</p>
        </div>
      </section>

      <aside class="pane pane-right" aria-label="Inspector">
        <header class="pane-header compact">
          <div>
            <p class="eyebrow">Inspector</p>
            <h2 id="inspectorTitle">未选择</h2>
          </div>
        </header>

        <div class="tab-row" role="tablist">
          <button class="tab active" type="button" data-tab="detail">任务</button>
          <button class="tab" type="button" data-tab="raw">原文</button>
          <button class="tab" type="button" data-tab="settings">配置</button>
        </div>

        <section id="detailTab" class="tab-panel active">
          <dl id="taskFacts" class="facts"></dl>
          <div class="action-grid">
            <button id="stopButton" class="danger" type="button">停止</button>
            <button id="rerunButton" type="button">重跑</button>
            <button id="doneButton" type="button">结束 Session</button>
          </div>
          <form id="steerForm" class="steer-form">
            <label>
              <span>补充要求</span>
              <textarea id="steerText" rows="4" placeholder="给当前 runner 的追加指令"></textarea>
            </label>
            <button type="submit">发送补充</button>
          </form>
          <h3>操作审计</h3>
          <div id="actionList" class="action-list"></div>
        </section>

        <section id="rawTab" class="tab-panel">
          <h3>任务原文</h3>
          <pre id="rawRequest" class="raw-box"></pre>
          <h3>元数据</h3>
          <pre id="rawMeta" class="raw-box"></pre>
          <div class="action-grid">
            <button id="exportButton" type="button">导出历史</button>
            <button id="clearButton" class="danger" type="button">清空历史</button>
          </div>
        </section>

        <section id="settingsTab" class="tab-panel">
          <form id="settingsForm" class="settings-form">
            <label>
              <span>默认 Agent</span>
              <input id="settingDefaultAgent" autocomplete="off" />
            </label>
            <label>
              <span>允许 Agent</span>
              <input id="settingAllowedAgents" autocomplete="off" />
            </label>
            <div class="toggle-list">
              <label><input id="settingHideNative" type="checkbox" />隐藏原生工具</label>
              <label><input id="settingHideTransfer" type="checkbox" />隐藏 transfer</label>
              <label><input id="settingRawInput" type="checkbox" />附带用户原话</label>
              <label><input id="settingSession" type="checkbox" />启用 session</label>
              <label><input id="settingLogRaw" type="checkbox" />记录 LLM 原文</label>
            </div>
            <label>
              <span>Session 超时</span>
              <input id="settingTimeout" type="number" min="1" step="1" />
            </label>
            <label>
              <span>调度提示模板</span>
              <textarea id="settingPrompt" rows="8"></textarea>
            </label>
            <button class="primary" type="submit">保存配置</button>
          </form>
        </section>
      </aside>
    </main>

    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </body>
</html>
